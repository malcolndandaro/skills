<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Liquid gradient</title>
<style>
  html, body { margin:0; height:100%; background:#040611; overflow:hidden }
  canvas { position:fixed; inset:0; width:100%; height:100%; display:block; pointer-events:none; z-index:0 }
  body.no-webgl canvas { display:none }
  body.no-webgl::before { content:""; position:fixed; inset:0; background:linear-gradient(180deg, #0b1a2e 0%, #061024 60%, #040611 100%) }
  .caption { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; pointer-events:none;
    font:600 clamp(28px,7vw,84px)/1 system-ui, -apple-system, "Segoe UI", sans-serif; color:#f2f5fa; letter-spacing:-.03em }
</style>
</head>
<body>
<canvas id="scene" aria-hidden="true"></canvas>
<div class="caption">Liquid</div>

<script>
'use strict';
/* -----------------------------------------------------------------------------
   FIELD SCENE — one fullscreen fragment shader (WebGL2, zero dependencies)
   For subjects that are continuous fields rather than particles: aurora, nebula
   clouds, liquid/mesh gradients, plasma, smoke, water caustics, sunsets.
   Every pixel evaluates `field(uv, p, t)`; the composite (tone map, vignette,
   grain, dither) runs in the same shader, so there is exactly one pass.
   The same `field()` contract works as the background pass of template-full.html.
   ----------------------------------------------------------------------------- */

/* ===== SUBJECT BLOCK START ===== */
// @template field
/* LIQUID GRADIENT — slow, glossy, brand-coloured blobs melting into each other (the "mesh gradient" look).
   The right tool for LIGHT backgrounds and product pages: no additive blending, so pastels and whites work.
   Domain-warped fbm decides where each colour lives; a faint sheen adds the glossy feel.
   Knobs: uColorA..D (four brand colours, linear RGB 0..1), uSpeed, uScale. Very cheap at resolutionScale 0.5. */

/* 1 ─ CONFIG ---------------------------------------------------------------------- */
const CONFIG = {
  resolutionScale: 0.5,
  post: { exposure: 1.0, grain: 0.03, vignette: 0.12 },
  subject: {
    uColorA: [0.42, 0.18, 0.84],   // violet
    uColorB: [0.13, 0.55, 0.95],   // azure
    uColorC: [0.98, 0.45, 0.55],   // coral
    uColorD: [0.98, 0.78, 0.35],   // amber
    uSpeed: 1.0, uScale: 0.9,
  },
};

/* 2 ─ FIELD ---------------------------------------------------------------------- */
const FIELD_GLSL = /* glsl */`
uniform vec3 uColorA, uColorB, uColorC, uColorD; uniform float uSpeed, uScale;

vec3 field(vec2 uv, vec2 p, float t) {
  t *= uSpeed * 0.08;
  vec2 q = p * uScale;
  vec2 w = vec2(fbm(q + vec2(t, -t * 0.7)), fbm(q + vec2(3.1 - t * 0.6, 1.7 + t)));   // warp field
  vec2 r = q + 2.5 * (w - 0.5);
  float n1 = fbm(r + t * 0.5);
  float n2 = fbm(r * 1.7 - vec2(t, 0.0) + 7.0);
  float n3 = fbm(r * 0.8 + 3.0 * w);
  vec3 col = mix(uColorA, uColorB, smoothstep(0.25, 0.75, n1));
  col = mix(col, uColorC, smoothstep(0.45, 0.85, n2) * 0.85);
  col = mix(col, uColorD, smoothstep(0.60, 0.95, n3) * 0.75);
  col += 0.10 * smoothstep(0.55, 0.80, n1) * (1.0 - uv.y * 0.5);                    // soft sheen toward the top
  return col;
}`;
/* ===== SUBJECT BLOCK END ===== */

/* 3 ─ ENGINE ------------------------------------------------------------------------ */
const VS = `#version 300 es
out vec2 vUv;
void main(){ vec2 p = vec2((gl_VertexID << 1) & 2, gl_VertexID & 2); vUv = p; gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0); }`;

const FS = `#version 300 es
precision highp float;
in vec2 vUv; out vec4 fragColor;
uniform float uTime, uAspect, uReduced, uExposure, uGrain, uVignette;
uniform vec2 uPointer, uRes;

// ── noise helpers (see references/shader-cookbook.md for simplex + curl) ──
float hash21(vec2 p){ p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
float vnoise(vec2 p){ vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash21(i), hash21(i + vec2(1, 0)), f.x), mix(hash21(i + vec2(0, 1)), hash21(i + vec2(1, 1)), f.x), f.y); }
float fbm(vec2 p){ float v = 0.0, a = 0.5; mat2 R = mat2(0.8, 0.6, -0.6, 0.8);
  for (int i = 0; i < 5; i++) { v += a * vnoise(p); p = R * p * 2.02 + 17.3; a *= 0.5; } return v; }

${FIELD_GLSL}

void main(){
  vec2 p = vUv * 2.0 - 1.0; p.x *= uAspect;
  vec3 c = field(vUv, p, uTime) * uExposure;
  c = clamp((c * (2.51 * c + 0.03)) / (c * (2.43 * c + 0.59) + 0.14), 0.0, 1.0);   // ACES
  c *= mix(1.0, smoothstep(1.15, 0.30, length(vUv - 0.5) * 1.55), uVignette);
  c += (hash21(vUv * uRes + uTime * 60.0) - 0.5) * uGrain;                           // grain
  c += (hash21(vUv * 1024.0) - 0.5) / 255.0;                                          // dither
  fragColor = vec4(c, 1.0);
}`;

const canvas = document.getElementById('scene');
const gl = canvas.getContext('webgl2', { alpha: false, antialias: false, depth: false, powerPreference: 'high-performance' });
if (!gl) { document.body.classList.add('no-webgl'); throw new Error('WebGL2 unavailable'); }

function compile(type, src) {
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS))
    throw new Error(gl.getShaderInfoLog(s) + '\n' + src.split('\n').map((l, i) => (i + 1) + ': ' + l).join('\n'));
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, VS)); gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FS));
gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
gl.useProgram(prog);
gl.bindVertexArray(gl.createVertexArray());                      // empty VAO; the triangle comes from gl_VertexID
const u = {}; for (let i = 0, n = gl.getProgramParameter(prog, gl.ACTIVE_UNIFORMS); i < n; i++) { const nm = gl.getActiveUniform(prog, i).name; u[nm] = gl.getUniformLocation(prog, nm); }

function resize() {
  const dpr = Math.min(devicePixelRatio || 1, 2) * CONFIG.resolutionScale;
  canvas.width = Math.max(2, Math.floor(canvas.clientWidth * dpr)); canvas.height = Math.max(2, Math.floor(canvas.clientHeight * dpr));
  gl.viewport(0, 0, canvas.width, canvas.height);
}
addEventListener('resize', resize); resize();

let pointer = [0, 0], target = [0, 0];
addEventListener('pointermove', e => { target = [(e.clientX / innerWidth) * 2 - 1, 1 - (e.clientY / innerHeight) * 2]; }, { passive: true });

const reduced = matchMedia('(prefers-reduced-motion: reduce)');
let t = 0, last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  if (document.hidden) { last = now; return; }
  const dt = Math.min((now - last) / 1000, 1 / 30); last = now;
  const calm = reduced.matches;
  if (!calm) t += dt;
  const k = 1 - Math.pow(0.001, dt);
  pointer[0] += (target[0] - pointer[0]) * k; pointer[1] += (target[1] - pointer[1]) * k;

  gl.uniform1f(u.uTime, t); gl.uniform1f(u.uAspect, canvas.width / canvas.height); gl.uniform1f(u.uReduced, calm ? 1 : 0);
  gl.uniform1f(u.uExposure, CONFIG.post.exposure); gl.uniform1f(u.uGrain, calm ? CONFIG.post.grain * 0.4 : CONFIG.post.grain);
  gl.uniform1f(u.uVignette, CONFIG.post.vignette);
  gl.uniform2f(u.uPointer, pointer[0], pointer[1]); gl.uniform2f(u.uRes, canvas.width, canvas.height);
  for (const k in CONFIG.subject) { const v = CONFIG.subject[k], loc = u[k]; if (loc == null) continue;
    typeof v === 'number' ? gl.uniform1f(loc, v) : v.length === 2 ? gl.uniform2fv(loc, v) : v.length === 3 ? gl.uniform3fv(loc, v) : gl.uniform4fv(loc, v); }
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
